<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecno Blog-Contatos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="cabecalho">
        <h1>Tecno Blog</h1>
        <nav class="menu-principal">
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="formacao.html">Formação</a></li>
                <li><a href="contato.html">Contatos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Contatos</h2>
        <section class="formacao-contato">

            <div>
                <article class="card-formacao-contato">
                    <span class="contato">Telefone:</span>
                    <P>(27)-99999-9999</P>
                </article>
            </div>

            <div>
                <article class="card-formacao-contato">
                    <span class="contato">Instagram:</span>
                    <a href="https://www.instagram.com/ricarduu_viana/" class="link-instagram">
                        <P>@ricarduu_viana</P>
                    </a>
                </article>
            </div>

            <div>
                <article class="card-formacao-contato">
                    <span class="contato">Email:</span>
                    <P>ricardo@ricardo.com</P>
                </article>
            </div>

            <div>
                <article class="card-formacao-contato">
                    <span class="contato">Assine a Newsletter</span>
                    <p>Receba novidades, artigos e dicas sobre tecnologia diretamente no seu e-mail.</p>

                    <form action="#" method="POST" class="form-newsletter">
                        <label for="email-newsletter" class="sr-only">Seu melhor e-mail:</label>
                        <div class="newsletter-grupo">
                            <input type="email" id="email-newsletter" name="email" placeholder="Digite seu e-mail..."
                                required>
                            <button type="submit" class="btn-newsletter">Inscrever-se</button>
                        </div>
                    </form>
                </article>

            </div>

        </section>
    </main>

    <footer>
        <p>
            Todos direitos reservados &copy; 2026 Ricardo Viana
        </p>

    </footer>
</body>

</html>
